<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Unicorn</title>
<meta name="description" content="Discover developers on Unicorn — real-time tech talent platform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:       #0b0b12;
  --surf:     #13131d;
  --surf2:    #1a1a28;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.12);
  --accent:   #e91e8c;
  --accent-d: rgba(233,30,140,0.15);
  --blue:     #5865f2;
  --green:    #23d18b;
  --text:     #e4e4f0;
  --text2:    #8888a0;
  --text3:    #44445a;
  --r:        14px;
  --hdr:      58px;
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

/* ── Header ── */
header {
  height: var(--hdr);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; position: relative; z-index: 10;
  background: var(--bg);
}

.logo-wrap {
  display: flex; align-items: center; gap: 9px;
  text-decoration: none; color: var(--text);
}
.logo-icon {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, #e91e8c, #7c3aed);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-name { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.02em; }

.hdr-title {
  position: absolute; left: 50%; transform: translateX(-50%);
  font-size: 0.9rem; font-weight: 400; color: var(--text2);
  letter-spacing: 0.03em; white-space: nowrap;
}
.hdr-title strong { color: var(--text); font-weight: 600; }

.hdr-right { display: flex; gap: 8px; }

.icon-btn {
  width: 32px; height: 32px; border-radius: 9px;
  background: var(--surf); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text2); transition: all 0.18s;
}
.icon-btn:hover { border-color: var(--border2); color: var(--text); background: var(--surf2); }

/* ── Main 3-col ── */
main {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: 260px 1fr 340px;
  overflow: hidden;
}

/* ── Filter Panel ── */
.filter-panel {
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px 14px;
  position: relative; background: var(--bg);
}
.filter-panel::after {
  content: '';
  position: absolute; inset: 6px;
  border: 1px solid rgba(233,30,140,0.18);
  border-radius: 12px; pointer-events: none;
  box-shadow: inset 0 0 28px rgba(233,30,140,0.03);
}

.fp-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; padding: 0 2px;
}
.fp-label { font-size: 0.8rem; font-weight: 600; color: var(--text2); }
.fp-search { background: none; border: none; cursor: pointer; color: var(--text3); display: flex; align-items: center; transition: color 0.2s; }
.fp-search:hover { color: var(--accent); }

.fsec { margin-bottom: 20px; }
.fsec-title {
  font-size: 0.68rem; font-weight: 500;
  color: var(--text3); text-transform: uppercase;
  letter-spacing: 0.1em; margin-bottom: 9px; padding: 0 2px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 2px; }

.chip {
  padding: 4px 12px; border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent; font-family: inherit;
  font-size: 0.73rem; color: var(--text2);
  cursor: pointer; transition: all 0.16s; line-height: 1.5;
}
.chip:hover  { border-color: rgba(233,30,140,0.4); color: rgba(233,30,140,.85); }
.chip.active { border-color: var(--accent); background: var(--accent-d); color: var(--accent); }

/* ── Globe Area ── */
.globe-area {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative; overflow: hidden;
  background: radial-gradient(ellipse at center, #0f0f1e 0%, var(--bg) 68%);
}
canvas#stars { position: absolute; inset: 0; width: 100%; height: 100%; }

.globe-wrap { position: relative; z-index: 2; }
canvas#globe {
  display: block; border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(100,180,255,0.08),
              0 0 55px rgba(30,90,255,0.22),
              0 0 110px rgba(30,90,255,0.08);
}

.globe-caption {
  margin-top: 20px; z-index: 2;
  font-size: 0.68rem; color: var(--text3);
  letter-spacing: 0.12em; text-transform: uppercase;
}

/* ── Cards Feed (Shorts/Reels style snap scroll) ── */
.cards-feed {
  border-left: 1px solid var(--border);
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  background: var(--bg);
  position: relative;
}
.cards-feed::-webkit-scrollbar { display: none; }

/* Each card = full panel height */
.dev-card {
  scroll-snap-align: start;
  scroll-snap-stop: always;
  height: calc(100vh - var(--hdr));
  display: flex; flex-direction: column;
  padding: 24px 20px 20px;
  border-bottom: 1px solid var(--border);
  position: relative; overflow: hidden;
  transition: background 0.2s;
  cursor: default;
}
.dev-card::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at top left, rgba(233,30,140,0.03), transparent 60%);
  opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.dev-card:hover::before { opacity: 1; }

/* Top row: avatar + identity + badges */
.dc-top {
  display: flex; align-items: flex-start; gap: 14px;
  margin-bottom: 18px; flex-shrink: 0;
}

.dc-avatar {
  width: 66px; height: 66px; border-radius: 50%;
  background: var(--surf2); border: 1.5px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden; position: relative;
}
.dc-avatar img { width: 100%; height: 100%; object-fit: cover; }
.dc-avatar-icon { color: var(--text3); }

.dc-identity { flex: 1; min-width: 0; }
.dc-name { font-size: 1.1rem; font-weight: 700; color: #fff; line-height: 1.2; }
.dc-username { font-size: 0.78rem; color: var(--text2); margin-top: 3px; }

.dc-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; margin-top: 4px; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; }
.status-dot.on  { background: var(--green); box-shadow: 0 0 8px rgba(35,209,139,.55); }
.status-dot.off { background: var(--text3); }
.v-icon { color: var(--blue); }

/* Meta row */
.dc-meta {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.78rem; color: var(--text2);
  margin-bottom: 20px; flex-shrink: 0;
}
.dc-meta-val { color: var(--text); font-weight: 600; }
.sep-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }

/* Divider */
.line { height: 1px; background: var(--border); margin: 0 0 18px; flex-shrink: 0; }

/* Skills */
.dc-section { margin-bottom: 16px; flex-shrink: 0; }
.dc-sec-lbl {
  font-size: 0.67rem; font-weight: 500;
  color: var(--text3); text-transform: uppercase;
  letter-spacing: 0.1em; margin-bottom: 8px;
}
.skill-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
.skill-row-key { font-size: 0.72rem; color: var(--text2); min-width: 36px; padding-top: 3px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  padding: 3px 10px; border-radius: 999px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border2);
  font-size: 0.7rem; color: var(--text2);
}

/* Spacer pushes bottom section down */
.dc-spacer { flex: 1; }

/* Portfolio + socials */
.dc-bottom { flex-shrink: 0; }
.portfolio-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.78rem; color: var(--accent);
  text-decoration: none; opacity: 0.85; transition: opacity 0.2s;
  margin-bottom: 16px;
}
.portfolio-link:hover { opacity: 1; }

.socials { display: flex; gap: 8px; margin-bottom: 18px; }
.soc-btn {
  width: 34px; height: 34px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: #fff;
  font-size: 0.68rem; font-weight: 700; font-family: monospace;
  transition: transform 0.18s, opacity 0.18s; opacity: 0.85;
}
.soc-btn:hover { transform: translateY(-2px); opacity: 1; }
.soc-gh { background: #24292e; }
.soc-li { background: #0a66c2; }
.soc-dc { background: var(--blue); }

/* Scroll indicator */
.scroll-hint {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.68rem; color: var(--text3);
}
.scroll-arrow {
  animation: bob 1.8s ease-in-out infinite;
  color: var(--text3);
}
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

/* Card counter badge */
.card-counter {
  position: absolute; top: 16px; right: 16px;
  font-size: 0.68rem; color: var(--text3);
  background: var(--surf); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 9px;
}

/* ── Self avatar ── */
.self-pin {
  position: fixed; bottom: 18px; left: 18px; z-index: 50;
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--surf2); border: 1.5px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--text2);
  transition: border-color 0.2s, box-shadow 0.2s;
}
.self-pin:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(233,30,140,0.3); }
</style>

<script>
/* ══════════════════════════════════════════════
   STARS
══════════════════════════════════════════════ */
(function() {
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [], t = 0;

  function resize() {
    const p = c.parentElement;
    c.width = p.clientWidth; c.height = p.clientHeight;
    stars = Array.from({length: Math.floor(c.width*c.height/4500)}, () => ({
      x: Math.random()*c.width, y: Math.random()*c.height,
      r: Math.random()*1.1+.2,
      a: Math.random()*.55+.1,
      sp: Math.random()*.35+.1,
      ph: Math.random()*Math.PI*2
    }));
  }

  function draw() {
    ctx.clearRect(0,0,c.width,c.height);
    t += .007;
    stars.forEach(s => {
      const a = s.a * (.55 + .45*Math.sin(t*s.sp+s.ph));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,210,255,${a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize, {passive:true});
  resize(); draw();
})();

/* ══════════════════════════════════════════════
   GLOBE
══════════════════════════════════════════════ */
(function() {
  const c = document.getElementById('globe');
  const ctx = c.getContext('2d');
  const W=c.width, H=c.height, cx=W/2, cy=H/2, R=W/2-2;

  // Continent blobs: [x%, y%, rx%, ry%, rot-deg, color]
  const lands = [
    [-.25,-.12,.22,.18, 15,'#2e7d32'],
    [ .05,-.28,.14,.12,-10,'#388e3c'],
    [ .30,-.05,.20,.22, 25,'#2e7d32'],
    [-.10, .18,.18,.14, -5,'#1b5e20'],
    [ .45,-.18,.10,.28, 40,'#33691e'],
    [-.38, .08,.16,.12, 10,'#2e7d32'],
    [ .15, .30,.12,.10,-20,'#388e3c'],
  ];
  const clouds = [
    [-.40,-.08,.35,.06],
    [ .10, .22,.28,.05],
    [-.15,-.30,.20,.04],
    [ .35, .05,.22,.05],
  ];

  let f = 0;

  function draw() {
    ctx.clearRect(0,0,W,H);

    // atmosphere glow
    const atm = ctx.createRadialGradient(cx,cy,R*.85,cx,cy,R+16);
    atm.addColorStop(0,'rgba(50,120,255,0)');
    atm.addColorStop(1,'rgba(50,120,255,0.16)');
    ctx.beginPath(); ctx.arc(cx,cy,R+16,0,Math.PI*2);
    ctx.fillStyle=atm; ctx.fill();

    // ocean
    const oc = ctx.createRadialGradient(cx-R*.25,cy-R*.25,R*.05,cx,cy,R);
    oc.addColorStop(0,'#2979ff');
    oc.addColorStop(.35,'#1565c0');
    oc.addColorStop(.75,'#0d3b8e');
    oc.addColorStop(1,'#061a4a');
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle=oc; ctx.fill();

    // continents (clipped, moving)
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
    const off = (f*.35) % (W*1.5);

    for(let sh=-W*1.5; sh<=W*1.5; sh+=W*1.5) {
      lands.forEach(([px,py,prx,pry,rot,col]) => {
        ctx.save();
        ctx.translate(cx+px*W+sh-off, cy+py*H);
        ctx.rotate(rot*Math.PI/180);
        ctx.globalAlpha=.68;
        ctx.beginPath();
        ctx.ellipse(0,0,prx*W,pry*H,0,0,Math.PI*2);
        ctx.fillStyle=col; ctx.fill();
        ctx.restore();
      });
    }

    // clouds
    const coff = (f*.5) % (W*1.5);
    for(let sh=-W*1.5; sh<=W*1.5; sh+=W*1.5) {
      clouds.forEach(([px,py,prx,pry]) => {
        ctx.save();
        ctx.globalAlpha=.16;
        ctx.beginPath();
        ctx.ellipse(cx+px*W+sh-coff, cy+py*H, prx*W, pry*H, 0, 0, Math.PI*2);
        ctx.fillStyle='#fff'; ctx.fill();
        ctx.restore();
      });
    }
    ctx.restore(); ctx.globalAlpha=1;

    // specular
    const sp = ctx.createRadialGradient(cx-R*.42,cy-R*.42,0,cx-R*.25,cy-R*.25,R*.85);
    sp.addColorStop(0,'rgba(255,255,255,.17)');
    sp.addColorStop(.4,'rgba(255,255,255,.05)');
    sp.addColorStop(1,'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle=sp; ctx.fill();

    // edge shadow
    const ed = ctx.createRadialGradient(cx,cy,R*.65,cx,cy,R);
    ed.addColorStop(0,'rgba(0,0,12,0)');
    ed.addColorStop(1,'rgba(0,0,12,.65)');
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.fillStyle=ed; ctx.fill();

    f++; requestAnimationFrame(draw);
  }
  draw();
})();

/* ══════════════════════════════════════════════
   FILTER CHIPS
══════════════════════════════════════════════ */
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => { chip.classList.toggle('active'); applyFilters(); });
});

function getFilters() {
  const f = { mood:[], coreSkills:[], experience:[] };
  document.querySelectorAll('[data-group]').forEach(g => {
    g.querySelectorAll('.chip.active').forEach(c => f[g.dataset.group].push(c.dataset.val));
  });
  return f;
}

function applyFilters() {
  const f = getFilters();
  document.querySelectorAll('.dev-card').forEach(card => {
    const mOk = !f.mood.length       || f.mood.includes(card.dataset.mood);
    const eOk = !f.experience.length || f.experience.includes(card.dataset.experience);
    const cOk = !f.coreSkills.length || f.coreSkills.some(s => (card.dataset.core||'').split(',').includes(s));
    card.style.display = (mOk && eOk && cOk) ? '' : 'none';
  });
}

    stackSkills:['Vue','Firebase','Tailwind'],
    portfolio:'https://priyanair.io',
    github:'https://github.com', linkedIn:'https://linkedin.com', discord:'priya#7732',
    online:true
  },
  {
    id:'5', firstName:'Leo', lastName:'Park', username:'leo_codes',
    mood:'PART_TIME', experience:'SENIOR',
    coreSkills:['Cloud','DevOps'],
    stackSkills:['Kubernetes','Go','GCP'],
    portfolio:null,
    github:'https://github.com', linkedIn:'https://linkedin.com', discord:null,
    online:false
  },
];

const ML  = { FULL_TIME:'Full-time', PART_TIME:'Part-time', FREELANCE:'Freelance' };
const EL  = { JUNIOR:'Junior', MID_LEVEL:'Mid-level', SENIOR:'Senior', EXPERT:'Expert' };
const TOTAL = USERS.length;

function avatarSVG() {
  return `<svg class="dc-avatar-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
  </svg>`;
}

function buildCard(u, idx) {
  const core = (u.coreSkills||[]).join(',');

  const coreTags  = (u.coreSkills  ||[]).map(s=>`<span class="tag">${s}</span>`).join('');
  const stackTags = (u.stackSkills ||[]).map(s=>`<span class="tag">${s}</span>`).join('');

  const portfolioHtml = u.portfolio ? `
    <a class="portfolio-link" href="${u.portfolio}" target="_blank" rel="noopener">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      ${u.portfolio.replace(/^https?:\/\//,'')}
    </a>` : '';

  const socHtml = [
    u.github    ? `<a class="soc-btn soc-gh" href="${u.github}"   target="_blank" rel="noopener" title="GitHub">GH</a>` : '',
    u.linkedIn  ? `<a class="soc-btn soc-li" href="${u.linkedIn}" target="_blank" rel="noopener" title="LinkedIn">in</a>` : '',
    u.discord   ? `<a class="soc-btn soc-dc" href="#" title="Discord: ${u.discord}">Dc</a>` : '',
  ].join('');

  return `
  <div class="dev-card"
    data-mood="${u.mood}"
    data-experience="${u.experience}"
    data-core="${core}"
    id="card-${u.id}">

    <div class="card-counter">${idx+1} / ${TOTAL}</div>

    <div class="dc-top">
      <div class="dc-avatar">
        ${u.profilePictureThumbnailUrl
          ? `<img src="${u.profilePictureThumbnailUrl}" alt="${u.firstName}" loading="lazy">`
          : avatarSVG()}
      </div>
      <div class="dc-identity">
        <div class="dc-name">${u.firstName} ${u.lastName}</div>
        <div class="dc-username">@${u.username}</div>
      </div>
      <div class="dc-badges">
        <div class="status-dot ${u.online?'on':'off'}" title="${u.online?'Online':'Offline'}"></div>
        <svg class="v-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" title="Verified">
          <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
        </svg>
      </div>
    </div>

    <div class="dc-meta">
      <span class="dc-meta-val">${ML[u.mood]}</span>
      <span class="sep-dot"></span>
      <span class="dc-meta-val">${EL[u.experience]}</span>
    </div>

    <div class="line"></div>

    <div class="dc-section">
      <div class="dc-sec-lbl">Skills</div>
      ${coreTags  ? `<div class="skill-row"><span class="skill-row-key">Core</span><div class="tags">${coreTags}</div></div>`  : ''}
      ${stackTags ? `<div class="skill-row"><span class="skill-row-key">Stack</span><div class="tags">${stackTags}</div></div>` : ''}
    </div>

    <div class="dc-spacer"></div>

    <div class="dc-bottom">
      <div class="line"></div>
      ${portfolioHtml}
      ${socHtml ? `<div class="dc-section"><div class="dc-sec-lbl">Socials</div><div class="socials">${socHtml}</div></div>` : ''}
      <div class="scroll-hint">
        <svg class="scroll-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>
        </svg>
        Scroll for next
      </div>
    </div>

  </div>`;
}

function render(users) {
  document.getElementById('cardsFeed').innerHTML = users.map(buildCard).join('');
  applyFilters();
}

// ── In production: replace with real API call ──
// fetch('/api/v1/dashboard')
//   .then(r => r.json())
//   .then(d => render(d.users))
//   .catch(console.error);
setTimeout(() => render(USERS), 300);
</script>
</body>
</html>
