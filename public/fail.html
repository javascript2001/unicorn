<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification Failed</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    font-size:16px;
}

body{
    min-height:100vh;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;

    background:linear-gradient(
        -45deg,
        #ff1744,
        #ff5252,
        #ff6e40,
        #ff3d00
    );
    background-size:400% 400%;
    animation:bgMove 12s ease infinite;
}

.card{
    width:min(100%, 520px);
    padding:clamp(24px,5vw,50px);
    border-radius:28px;

    background:rgba(255,255,255,.12);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);

    text-align:center;
    color:#fff;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    animation:appear .7s ease;
}

.error-icon{
    width:clamp(80px,20vw,120px);
    height:clamp(80px,20vw,120px);

    margin-inline:auto;
    border-radius:50%;

    background:#fff;
    color:#ff1744;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:clamp(2.5rem,7vw,4rem);
    font-weight:700;
}

h1{
    margin-top:24px;
    font-size:clamp(
        1.5rem,
        5vw,
        2.2rem
    );
    line-height:1.2;
}

p{
    margin-top:14px;
    line-height:1.7;
    font-size:clamp(
        .95rem,
        3vw,
        1.05rem
    );
    opacity:.95;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    width:100%;
    max-width:280px;

    margin-top:28px;

    padding:14px 24px;

    border-radius:999px;

    background:#fff;
    color:#ff1744;

    text-decoration:none;
    font-weight:600;

    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
}

.blob{
    position:fixed;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    pointer-events:none;
}

.b1{
    width:35vw;
    height:35vw;
    min-width:180px;
    min-height:180px;

    top:-8%;
    left:-8%;
}

.b2{
    width:40vw;
    height:40vw;
    min-width:220px;
    min-height:220px;

    bottom:-10%;
    right:-10%;
}

@keyframes bgMove{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Extra small devices */
@media (max-width:480px){

    body{
        padding:16px;
    }

    .card{
        border-radius:22px;
    }

    .btn{
        width:100%;
        max-width:none;
    }

    .blob{
        opacity:.5;
    }
}

/* Tablets */
@media (min-width:768px){

    .card{
        max-width:560px;
    }
}

/* Large desktops */
@media (min-width:1400px){

    .card{
        max-width:620px;
    }
}
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<div class="card">
    <div class="error-icon">✕</div>

    <h1>Verification Failed</h1>

    <p>
        This verification link is invalid, expired,
        or has already been used.
    </p>

    <a href="/" class="btn">Back to Home</a>
</div>

</body>
</html>
