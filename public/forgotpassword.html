<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#667eea,#764ba2,#6a11cb,#2575fc);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
    padding:20px;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:100%;
    max-width:450px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    padding:35px;
    box-shadow:0 8px 32px rgba(0,0,0,.2);
    animation:fadeIn .6s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.title{
    color:white;
    text-align:center;
    font-size:28px;
    font-weight:600;
    margin-bottom:10px;
}

.subtitle{
    color:rgba(255,255,255,.8);
    text-align:center;
    margin-bottom:30px;
    font-size:14px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    color:white;
    margin-bottom:8px;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.2);
    color:white;
    font-size:15px;
}

input::placeholder{
    color:rgba(255,255,255,.7);
}

.error{
    color:#ffb3b3;
    font-size:13px;
    margin-top:8px;
    display:none;
}

.success{
    color:#9fff9f;
    font-size:13px;
    margin-top:8px;
    display:none;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:white;
    color:#5b4be7;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover:not(:disabled){
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

button:disabled{
    cursor:not-allowed;
    opacity:.5;
}

.message{
    margin-top:20px;
    text-align:center;
    color:white;
    font-weight:500;
}

.countdown{
    margin-top:10px;
    text-align:center;
    color:#fff;
    font-size:14px;
}

.loader{
    display:none;
    width:22px;
    height:22px;
    border:3px solid rgba(255,255,255,.3);
    border-top:3px solid white;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:15px auto;
}

@keyframes spin{
    100%{
        transform:rotate(360deg);
    }
}

@media(max-width:500px){
    .card{
        padding:25px;
    }

    .title{
        font-size:24px;
    }
}
</style>
</head>
<body>

<div class="card">

    <h1 class="title">Reset Password</h1>
    <p class="subtitle">Create a new secure password</p>

    <form id="resetForm">

        <div class="form-group">
            <label>New Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter new password"
                required
            >
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >

            <div id="error" class="error">
                Passwords do not match
            </div>

            <div id="successMatch" class="success">
                Passwords match ✓
            </div>
        </div>

        <button id="submitBtn" disabled>
            Change Password
        </button>

    </form>

    <div class="loader" id="loader"></div>

    <div class="message" id="message"></div>
    <div class="countdown" id="countdown"></div>

</div>

<script>
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");

const error = document.getElementById("error");
const successMatch = document.getElementById("successMatch");

const submitBtn = document.getElementById("submitBtn");
const form = document.getElementById("resetForm");

const loader = document.getElementById("loader");
const message = document.getElementById("message");
const countdown = document.getElementById("countdown");

function validatePasswords() {

    if (!confirmPassword.value) {
        error.style.display = "none";
        successMatch.style.display = "none";
        submitBtn.disabled = true;
        return;
    }

    if (password.value === confirmPassword.value) {
        error.style.display = "none";
        successMatch.style.display = "block";
        submitBtn.disabled = false;
    } else {
        successMatch.style.display = "none";
        error.style.display = "block";
        submitBtn.disabled = true;
    }
}

password.addEventListener("input", validatePasswords);
confirmPassword.addEventListener("input", validatePasswords);

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const token =
        new URLSearchParams(window.location.search)
        .get("token");

    if (!token) {
        message.style.color = "#ffb3b3";
        message.innerText = "Token not found in URL.";
        return;
    }

    submitBtn.disabled = true;
    loader.style.display = "block";

    try {

        const response = await fetch(
            "http://localhost:3000/api/v1/auth/forgot-password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    newPassword: password.value,
                    token: token
                })
            }
        );

        loader.style.display = "none";

        if (response.status === 200) {

            message.style.color = "#9fff9f";
            message.innerHTML =
                "✅ Password changed successfully!";

            let seconds = 5;

            countdown.innerHTML =
                `This page will close in ${seconds}s`;

            const timer = setInterval(() => {

                seconds--;

                countdown.innerHTML =
                    `This page will close in ${seconds}s`;

                if (seconds <= 0) {

                    clearInterval(timer);

                    window.close();

                    // fallback if browser blocks close
                    setTimeout(() => {
                        window.location.href = "about:blank";
                    }, 100);

                }

            }, 1000);

        } else {

            const data = await response.json().catch(() => ({}));

            message.style.color = "#ffb3b3";
            message.innerText =
                data.message ||
                "Failed to change password.";

            submitBtn.disabled = false;
        }

    } catch (err) {

        loader.style.display = "none";

        message.style.color = "#ffb3b3";
        message.innerText =
            "Server connection failed.";

        submitBtn.disabled = false;
    }

});
</script>

</body>
</html>
